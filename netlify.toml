# Netlify Configuration for GNEP Africa
# Global Nature and Environmental Partnership

[build]
  publish = "."

# 404 Error handling
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# High-performance asset caching (WebP images, CSS, JS)
[[headers]]
  for = "/assets/real/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Essential security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
