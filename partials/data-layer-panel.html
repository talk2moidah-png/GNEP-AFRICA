/* Layer Control UI */
<section id="data-layer-panel" class="position-fixed top-0 end-0 m-3 p-3 bg-white border rounded" style="z-index: 1050; max-width: 250px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
  <h5 class="mb-2">Environmental Data Layers</h5>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" value="gibs-modis" id="layer-gibs-modis">
    <label class="form-check-label" for="layer-gibs-modis">
      NASA MODIS Terra (True Color)
    </label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" value="copernicus-s2" id="layer-copernicus-s2">
    <label class="form-check-label" for="layer-copernicus-s2">
      Copernicus Sentinel‑2 (NDVI)
    </label>
  </div>
</section>
